[project]
name = "renpy-translator"
version = "0.3.0"
description = "Ren'Py 游戏汉化工具：AI 翻译 + 手动校对，支持解包/反编译、人名与角色分析、内嵌文本提取、一键导出成品游戏"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.137.1",
    "openai>=2.41.1",
    "pillow>=12.3.0",
    "pystray>=0.19.5",
    "python-multipart>=0.0.32",
    "pythonnet>=3.1.0 ; sys_platform == 'win32'",
    "pywebview>=6.2.1",
    "sse-starlette>=3.4.6",
    "tiktoken>=0.7.0",
    "uvicorn[standard]>=0.49.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pyinstaller>=6.21.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# 只收集 tests/：tools/test_*.py 是模块级副作用脚本（直接执行用例并
# sys.exit），裸跑 pytest 误收集会在导入期炸掉整个会话
testpaths = ["tests"]
