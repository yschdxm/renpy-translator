[project]
name = "renpy-translator"
version = "0.1.3"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.137.1",
    "openai>=2.41.1",
    "pillow>=12.3.0",
    "pystray>=0.19.5",
    "python-multipart>=0.0.32",
    "pythonnet>=3.1.0 ; sys_platform == 'win32'",
    "pywebview>=6.2.1",
    "sse-starlette>=3.4.6",
    "tiktoken>=0.7.0",
    "uvicorn[standard]>=0.49.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pyinstaller>=6.21.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
