name: build

# 跨平台打包：PyInstaller 不能交叉编译，在每个 OS 上分别构建。
# 产物：
#   Windows: dist/installer/renpy-translator-setup-*-windows.exe（Inno Setup 安装包）
#   macOS:   dist/renpy-translator-macos.dmg（.app 封装）
#   Linux:   dist/renpy-translator-linux.tar.gz
# 用法：推 tag（如 v0.2.0）触发（自动挂 Release），或手动 workflow_dispatch。

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write  # tag 触发时上传 Release 附件需要

env:
  UNRPYC_VERSION: '2.0.4'

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: renpy-translator-windows
          - os: ubuntu-latest
            artifact: renpy-translator-linux-amd64
            arch: amd64
          - os: ubuntu-24.04-arm
            artifact: renpy-translator-linux-arm64
            arch: arm64
          - os: macos-latest
            artifact: renpy-translator-macos

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build frontend
        working-directory: web
        run: |
          npm ci
          npm run build

      - uses: astral-sh/setup-uv@v5
        with:
          version: latest

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: uv sync

      - name: Install GTK/WebKit (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-gi gir1.2-webkit2-4.1 \
            gir1.2-appindicator3-0.1 libgirepository1.0-dev

      - name: Stage unrpyc
        shell: bash
        run: |
          mkdir -p staging/tools
          curl -sL "https://github.com/CensoredUsername/unrpyc/archive/refs/tags/v${UNRPYC_VERSION}.zip" -o /tmp/unrpyc.zip
          python -m zipfile -e /tmp/unrpyc.zip staging/tools/
          mv "staging/tools/unrpyc-${UNRPYC_VERSION}" staging/tools/unrpyc

      - name: Stage python-embed (Windows, unrpyc 冻结运行用)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          curl -sL "https://www.python.org/ftp/python/3.12.10/python-3.12.10-embed-amd64.zip" -o /tmp/pyembed.zip
          mkdir -p staging/tools/python-embed
          python -m zipfile -e /tmp/pyembed.zip staging/tools/python-embed/

      - name: Generate icons
        shell: bash
        run: |
          uv run python installer/make_icon.py
          # macOS: .app 图标需要 .icns（sips + iconutil 现场转换）
          if [ "$RUNNER_OS" == "macOS" ]; then
            mkdir -p icon.iconset
            for s in 16 32 128 256 512; do
              sips -z $s $s installer/icon.png --out "icon.iconset/icon_${s}x${s}.png" >/dev/null
              sips -z $((s*2)) $((s*2)) installer/icon.png --out "icon.iconset/icon_${s}x${s}@2x.png" >/dev/null
            done
            iconutil -c icns icon.iconset -o installer/icon.icns
          fi

      - name: PyInstaller build
        run: uv run pyinstaller renpy-translator.spec --noconfirm

      - name: Smoke test (health check)
        shell: bash
        run: |
          if [ "$RUNNER_OS" == "Windows" ]; then EXE=dist/renpy-translator/renpy-translator.exe;
          else EXE=dist/renpy-translator/renpy-translator; fi
          "$EXE" --mode server-detached &
          ok=""
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:7861/api/health; then ok=1; break; fi
            sleep 1
          done
          [ -n "$ok" ] || { echo "SMOKE FAILED: server did not come up"; exit 1; }
          "$EXE" --mode stop || true

      - name: Compute version
        shell: bash
        run: |
          # tag v1.2.3 → 1.2.3；手动触发 → dev 占位
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then V="${GITHUB_REF_NAME#v}"; else V="dev"; fi
          echo "VERSION=$V" >> "$GITHUB_ENV"
          # deb/rpm 元数据版本字段必须以数字开头，dev 占位时兜底 0.0.0（文件名不受影响）
          PKGV="$V"; [[ "$V" =~ ^[0-9] ]] || PKGV="0.0.0"
          echo "PKG_VERSION=$PKGV" >> "$GITHUB_ENV"

      - name: Build installer (Windows, Inno Setup)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /DAppVersion=${env:VERSION} installer\renpy-translator.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build DMG (macOS)
        if: runner.os == 'macOS'
        run: |
          hdiutil create -volname "Ren'Py 翻译工具" \
            -srcfolder dist/RenPyTranslator.app -ov -format UDZO \
            "dist/renpy-translator-${VERSION}-macos.dmg"

      - name: Build deb (Linux)
        if: runner.os == 'Linux'
        run: |
          PKG=dist/deb/renpy-translator
          DEBARCH=amd64; [ "$(uname -m)" = "aarch64" ] && DEBARCH=arm64
          mkdir -p "$PKG/DEBIAN" "$PKG/opt" "$PKG/usr/share/applications" \
                   "$PKG/usr/bin" "$PKG/usr/share/icons/hicolor/256x256/apps"
          cp -r dist/renpy-translator "$PKG/opt/"
          {
            echo 'Package: renpy-translator'
            echo "Version: ${PKG_VERSION}"
            echo "Architecture: $DEBARCH"
            echo 'Maintainer: yschdxm'
            echo 'Depends: python3-gi, gir1.2-webkit2-4.1, gir1.2-appindicator3-0.1'
            echo 'Section: utils'
            echo 'Priority: optional'
            echo "Description: Ren'Py game translation tool (tray + WebUI)"
          } > "$PKG/DEBIAN/control"
          cp installer/renpy-translator.desktop "$PKG/usr/share/applications/"
          cp installer/icon.png "$PKG/usr/share/icons/hicolor/256x256/apps/renpy-translator.png"
          ln -s /opt/renpy-translator/renpy-translator "$PKG/usr/bin/renpy-translator"
          dpkg-deb --build "$PKG" "dist/renpy-translator-${VERSION}-linux-${DEBARCH}.deb"

      - name: Build rpm (Linux, Fedora/RHEL/openSUSE)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y rpm
          mkdir -p rpmbuild/{BUILD,RPMS,SOURCES,SPECS,SRPMS}
          cp -r dist/renpy-translator rpmbuild/SOURCES/
          cp installer/renpy-translator.desktop rpmbuild/SOURCES/
          cp installer/icon.png rpmbuild/SOURCES/renpy-translator.png
          RPM_VERSION=$(echo "$PKG_VERSION" | tr '-' '.')
          RPMARCH=amd64; [ "$(uname -m)" = "aarch64" ] && RPMARCH=arm64
          rpmbuild -bb --define "_topdir $PWD/rpmbuild" \
            --define "_version $RPM_VERSION" installer/rpm.spec
          cp rpmbuild/RPMS/*/renpy-translator-*.rpm \
            "dist/renpy-translator-${VERSION}-linux-${RPMARCH}.rpm"

      - name: Build AppImage (Linux, 通用免安装)
        if: runner.os == 'Linux'
        run: |
          mkdir -p AppDir/usr/bin
          cp -r dist/renpy-translator/* AppDir/usr/bin/
          cp installer/icon.png AppDir/renpy-translator.png
          {
            echo '[Desktop Entry]'
            echo 'Type=Application'
            echo "Name=Ren'Py Translator"
            echo 'Exec=renpy-translator'
            echo 'Icon=renpy-translator'
            echo 'Terminal=false'
            echo 'Categories=Utility;'
          } > AppDir/renpy-translator.desktop
          printf '#!/bin/sh\nDIR="$(dirname "$(readlink -f "$0")")"\nexec "$DIR/usr/bin/renpy-translator" "$@"\n' > AppDir/AppRun
          chmod +x AppDir/AppRun
          TOOL_ARCH=$(uname -m)  # x86_64 或 aarch64
          curl -sL "https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-${TOOL_ARCH}.AppImage" -o /tmp/appimagetool
          chmod +x /tmp/appimagetool
          /tmp/appimagetool --appimage-extract-and-run AppDir \
            "dist/renpy-translator-${VERSION}-linux-${TOOL_ARCH}.AppImage"

      - name: Package Linux tarball
        if: runner.os == 'Linux'
        run: |
          cd dist && tar -czf "renpy-translator-${VERSION}-linux-${{ matrix.arch }}.tar.gz" renpy-translator

      - name: Package Windows portable zip
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path dist\renpy-translator `
            -DestinationPath "dist\renpy-translator-${env:VERSION}-windows-portable.zip"

      - name: Upload Windows packages
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            dist/installer/*.exe
            dist/renpy-translator-*-windows-portable.zip

      - name: Upload macOS DMG
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/renpy-translator-*-macos.dmg

      - name: Upload Linux packages
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            dist/renpy-translator-*-linux-*.tar.gz
            dist/renpy-translator-*-linux-*.deb
            dist/renpy-translator-*-linux-*.rpm
            dist/renpy-translator-*-linux-*.AppImage

      - name: Upload to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/installer/*.exe
            dist/renpy-translator-*-windows-portable.zip
            dist/renpy-translator-*-macos.dmg
            dist/renpy-translator-*-linux-*.tar.gz
            dist/renpy-translator-*-linux-*.deb
            dist/renpy-translator-*-linux-*.rpm
            dist/renpy-translator-*-linux-*.AppImage
