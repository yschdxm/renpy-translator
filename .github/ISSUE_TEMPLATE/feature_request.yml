name: 💡 功能建议
description: 提出新功能或改进想法
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: background
    attributes:
      label: 使用场景 / 要解决的问题
      description: 你在什么场景下遇到了什么不便？（比直接提方案更重要）
      placeholder: 例：翻译多人协作时，希望能……因为目前……
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 期望的方案
      description: 你希望工具怎么做
      placeholder: 例：项目导出时增加「仅导出译文」选项……
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案
      description: 目前你是怎么 workaround 的（可选）
    validations:
      required: false
